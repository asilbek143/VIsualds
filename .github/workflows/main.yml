name: Build DEX CLINT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: gradle wrapper --gradle-version 8.11 && ./gradlew build --refresh-dependencies

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DEX-CLINT
          path: build/libs/*.jar
