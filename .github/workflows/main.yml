name: Build JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show project files
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== GRADLE FILES ==="
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          GRADLE_FILE=$(find . -type f -name "build.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle topilmadi!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: '**/build/libs/*.jar'
